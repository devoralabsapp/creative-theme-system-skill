<!doctype html>
<html lang="en">
<head>
 <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
 <title>Design Lab — Devoralabs Theme Explorer</title>
 <meta name="description" content="Explore every Devoralabs theme in Design Lab, then compare the same theme in Website Demo. One collection, two ways to see it.">
 <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
 <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet">
 <link rel="stylesheet" href="explorer.css"><script src="theme-registry.js"></script><script src="explorer.js" defer></script>
</head>
<body>
 <a class="explorer-skip" href="#preview-panels">Skip to preview</a>
 <header class="explorer-header">
  <a class="explorer-brand" href="./" aria-label="Devoralabs Theme Explorer home">devoralabs<span>.</span><small>THEME EXPLORER</small></a>
  <div class="explorer-tabs" role="tablist" aria-label="Preview type">
   <button id="lab-tab" type="button" role="tab" aria-selected="true" aria-controls="lab-panel" data-view="lab">Design Lab</button>
   <button id="website-tab" type="button" role="tab" aria-selected="false" aria-controls="website-panel" data-view="website" tabindex="-1">Website Demo</button>
  </div>
  <div class="explorer-context"><label for="explorer-theme">Theme</label><select id="explorer-theme" aria-describedby="explorer-theme-count"></select><small id="explorer-theme-count"></small><span id="explorer-theme-name" hidden></span></div>
  <a class="explorer-repo" href="https://github.com/devoralabsapp/creative-theme-system-skill" target="_blank" rel="noopener noreferrer">GitHub ↗</a>
 </header>
 <main id="preview-panels">
  <p id="preview-status" role="status" aria-live="polite">Loading Design Lab…</p>
  <section id="lab-panel" role="tabpanel" aria-labelledby="lab-tab"><iframe id="lab-preview" title="Design Lab workspace" height="900"></iframe></section>
  <section id="website-panel" role="tabpanel" aria-labelledby="website-tab" hidden><iframe id="website-preview" title="Website demo" height="900"></iframe></section>
 </main>
 <noscript>This interactive theme explorer needs JavaScript. You can also open the <a href="lab/index.html">Design Lab</a> or <a href="website.html">Website Demo</a> directly.</noscript>
</body>
</html>
